name: Tobi Validator Example

on:
  workflow_dispatch:
  pull_request:
  push:

# Tobi supplies validator success or failure. Repository branch protection and
# workflow policy determine whether that result blocks merge or release.

jobs:
  canon-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Tobi canon
        uses: OrganeticSphere/tobi-validator@v2
        with:
          mode: canon
          canon_input: examples/sample.tsubasa

  golden-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Tobi golden
        uses: OrganeticSphere/tobi-validator@v2
        with:
          mode: golden
          golden_fixtures: examples/golden/fixtures.json
