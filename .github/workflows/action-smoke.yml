name: Action smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canon:
    name: ${{ matrix.os }} canon
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15
          - macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run local action canon
        uses: ./
        with:
          mode: canon
          canon_input: examples/sample.tsubasa

  golden:
    name: ${{ matrix.os }} golden
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15
          - macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run local action golden
        uses: ./
        with:
          mode: golden
          golden_fixtures: examples/golden/fixtures.json
