name: "Organetic Tobi Validator"
description: "GitHub Action wrapper for the released Stage 1 Tobi Validator line with controlled evaluation or private artifact access"

branding:
  icon: "shield"
  color: "purple"

inputs:
  eval_token:
    description: "7-day evaluation token issued by Organetic evaluation broker"
    required: false
  dist_token:
    description: "Read-only token with access to the private OrganeticSphere/tobi-validator-dist repository"
    required: false
  version:
    description: "Release tag in OrganeticSphere/tobi-validator-dist"
    required: false
    default: "stage1-tobi-validator-v0.7.0"
  dist_repo:
    description: "Private distribution repository containing the validator release assets"
    required: false
    default: "OrganeticSphere/tobi-validator-dist"
  archive_name:
    description: "Optional explicit bundle archive name. When omitted, the action infers the archive from runner OS and architecture."
    required: false
    default: ""
  archive_sha256_name:
    description: "Optional explicit checksum sidecar name. When omitted, the action uses <archive_name>.sha256."
    required: false
    default: ""
  mode:
    description: "Validator mode: canon or golden"
    required: true
  canon_input:
    description: "Path to the input file for canon mode"
    required: false
    default: "examples/sample.tsubasa"
  golden_fixtures:
    description: "Path to the fixture JSON for golden mode"
    required: false
    default: "examples/golden/fixtures.json"

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: pwsh
      run: |
        $mode = "${{ inputs.mode }}".ToLowerInvariant()
        $evalToken = "${{ inputs.eval_token }}"
        $distToken = "${{ inputs.dist_token }}"

        if ([string]::IsNullOrWhiteSpace($evalToken) -and [string]::IsNullOrWhiteSpace($distToken)) {
          throw "Provide either 'eval_token' or 'dist_token'."
        }

        if ($mode -ne "canon" -and $mode -ne "golden") {
          throw "Input 'mode' must be either 'canon' or 'golden'."
        }

    - name: Resolve platform archive names
      shell: pwsh
      run: |
        $explicitArchive = "${{ inputs.archive_name }}"
        $explicitSha = "${{ inputs.archive_sha256_name }}"
        $version = "${{ inputs.version }}"
        $runnerOs = "$env:RUNNER_OS"
        $runnerArch = "$env:RUNNER_ARCH"

        if ([string]::IsNullOrWhiteSpace($explicitArchive)) {
          switch ($runnerOs) {
            "Windows" {
              if ($runnerArch -ne "X64") {
                throw "Unsupported Windows runner architecture for Tobi Validator: $runnerArch"
              }
              $archiveName = "windows-x86_64-release-archive.zip"
            }
            "Linux" {
              if ($runnerArch -ne "X64") {
                throw "Unsupported Linux runner architecture for Tobi Validator: $runnerArch"
              }
              $archiveName = "linux-x86_64-release-archive.zip"
            }
            "macOS" {
              if ($runnerArch -eq "ARM64") {
                $archiveName = "macos-arm64-release-archive.zip"
              }
              elseif ($runnerArch -eq "X64") {
                $archiveName = "macos-x86_64-release-archive.zip"
              }
              else {
                throw "Unsupported macOS runner architecture for Tobi Validator: $runnerArch"
              }
            }
            default {
              throw "Unsupported runner OS for Tobi Validator: $runnerOs"
            }
          }
        }
        else {
          $archiveName = $explicitArchive
        }

        if ([string]::IsNullOrWhiteSpace($explicitSha)) {
          $shaName = "$archiveName.sha256"
        }
        else {
          $shaName = $explicitSha
        }

        "TOBI_ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "TOBI_ARCHIVE_SHA256_NAME=$shaName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "TOBI_RUNNER_OS=$runnerOs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "TOBI_RUNNER_ARCH=$runnerArch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        Write-Host "Resolved Tobi archive: $archiveName"
        Write-Host "Resolved Tobi checksum sidecar: $shaName"

    - name: Download bundle via evaluation broker
      if: ${{ inputs.eval_token != '' }}
      shell: pwsh
      run: |
        $brokerUrl = "https://api.organetic.ai/api/eval/download"
        $version = "${{ inputs.version }}"
        $archiveName = "$env:TOBI_ARCHIVE_NAME"
        $shaName = "$env:TOBI_ARCHIVE_SHA256_NAME"
        $repo = "${{ github.repository }}"
        $runId = "${{ github.run_id }}"
        $token = "${{ inputs.eval_token }}"

        $headers = @{
          Authorization = "Bearer $token"
          "Content-Type" = "application/json"
        }

        $archiveBody = @{
          version = $version
          asset = $archiveName
          repo = $repo
          run_id = $runId
        } | ConvertTo-Json -Compress

        $shaBody = @{
          version = $version
          asset = $shaName
          repo = $repo
          run_id = $runId
        } | ConvertTo-Json -Compress

        Invoke-WebRequest -Method POST -Uri $brokerUrl -Headers $headers -Body $archiveBody -OutFile $archiveName
        Invoke-WebRequest -Method POST -Uri $brokerUrl -Headers $headers -Body $shaBody -OutFile $shaName

    - name: Resolve private release directly
      if: ${{ inputs.eval_token == '' && inputs.dist_token != '' }}
      shell: pwsh
      run: |
        $headers = @{
          Authorization = "Bearer ${{ inputs.dist_token }}"
          Accept = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
        }

        $repo = "${{ inputs.dist_repo }}"
        $tag = "${{ inputs.version }}"
        $releaseUrl = "https://api.github.com/repos/$repo/releases/tags/$tag"

        try {
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers -Method Get -ErrorAction Stop
        }
        catch {
          throw "Failed to resolve private release '$tag' in '$repo'. Check that the tag exists and that 'dist_token' has read access."
        }

        $archiveName = "$env:TOBI_ARCHIVE_NAME"
        $shaName = "$env:TOBI_ARCHIVE_SHA256_NAME"
        $explicitSha = "${{ inputs.archive_sha256_name }}"

        $archiveAsset = $release.assets | Where-Object { $_.name -eq $archiveName } | Select-Object -First 1
        $shaAsset = $release.assets | Where-Object { $_.name -eq $shaName } | Select-Object -First 1

        if ($null -eq $archiveAsset) {
          throw "Release asset not found: $archiveName"
        }

        "TOBI_ASSET_URL=$($archiveAsset.url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        if ($null -ne $shaAsset) {
          "TOBI_SHA_ASSET_URL=$($shaAsset.url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        elseif ([string]::IsNullOrWhiteSpace($explicitSha) -and "$($archiveAsset.digest)" -match '^sha256:([0-9a-fA-F]{64})$') {
          "TOBI_EXPECTED_SHA256=$($matches[1].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using GitHub release asset digest for checksum verification."
        }
        elseif ([string]::IsNullOrWhiteSpace($explicitSha)) {
          throw "Release checksum not found for $archiveName. Expected sidecar '$shaName' or a GitHub release asset digest."
        }
        else {
          throw "Release asset not found: $shaName"
        }

    - name: Download private bundle assets directly
      if: ${{ inputs.eval_token == '' && inputs.dist_token != '' }}
      shell: pwsh
      run: |
        $downloadHeaders = @{
          Authorization = "Bearer ${{ inputs.dist_token }}"
          Accept = "application/octet-stream"
          "X-GitHub-Api-Version" = "2022-11-28"
        }

        Invoke-WebRequest -Uri $env:TOBI_ASSET_URL -Headers $downloadHeaders -OutFile "$env:TOBI_ARCHIVE_NAME"

        if (-not [string]::IsNullOrWhiteSpace("$env:TOBI_SHA_ASSET_URL")) {
          Invoke-WebRequest -Uri $env:TOBI_SHA_ASSET_URL -Headers $downloadHeaders -OutFile "$env:TOBI_ARCHIVE_SHA256_NAME"
        }

    - name: Verify bundle checksum
      shell: pwsh
      run: |
        if (-not [string]::IsNullOrWhiteSpace("$env:TOBI_EXPECTED_SHA256")) {
          $expectedHash = "$env:TOBI_EXPECTED_SHA256".ToLowerInvariant()
        }
        else {
          $expectedLine = (Get-Content "$env:TOBI_ARCHIVE_SHA256_NAME" -Raw).Trim()
          $expectedHash = ($expectedLine -split '\s+')[0].ToLowerInvariant()
        }

        $actualHash = (Get-FileHash "$env:TOBI_ARCHIVE_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()

        if ($actualHash -ne $expectedHash) {
          throw "Archive checksum mismatch. Expected $expectedHash but got $actualHash."
        }

    - name: Extract bundle
      shell: pwsh
      run: |
        $archiveName = "$env:TOBI_ARCHIVE_NAME"
        $bundleDir = "tobi-bundle"

        if (Test-Path -LiteralPath $bundleDir) {
          Remove-Item -LiteralPath $bundleDir -Recurse -Force
        }

        New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

        if ($archiveName.EndsWith(".zip", [System.StringComparison]::OrdinalIgnoreCase)) {
          Expand-Archive -LiteralPath $archiveName -DestinationPath $bundleDir -Force
        }
        elseif ($archiveName.EndsWith(".tar.gz", [System.StringComparison]::OrdinalIgnoreCase)) {
          tar -xzf $archiveName -C $bundleDir
          if ($LASTEXITCODE -ne 0) {
            throw "tar extraction failed for $archiveName"
          }
        }
        else {
          throw "Unsupported Tobi archive format: $archiveName"
        }

    - name: Resolve extracted tobi executable
      shell: pwsh
      run: |
        if ("$env:TOBI_RUNNER_OS" -eq "Windows") {
          $exe = Get-ChildItem -Path "tobi-bundle" -Filter "tobi.exe" -Recurse | Select-Object -First 1
          $exeLabel = "tobi.exe"
        }
        else {
          $exe = Get-ChildItem -Path "tobi-bundle" -Filter "tobi" -File -Recurse | Select-Object -First 1
          $exeLabel = "tobi"
        }

        if ($null -eq $exe) {
          throw "$exeLabel was not found anywhere under tobi-bundle after archive extraction."
        }

        if ("$env:TOBI_RUNNER_OS" -ne "Windows") {
          chmod +x $exe.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to mark Tobi executable as executable: $($exe.FullName)"
          }
        }

        "TOBI_EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Run canon
      if: ${{ inputs.mode == 'canon' }}
      shell: pwsh
      run: |
        $inputPath = "${{ inputs.canon_input }}"
        if (-not (Test-Path -LiteralPath $inputPath)) {
          throw "Canon input not found: $inputPath"
        }

        $resolvedInput = (Resolve-Path -LiteralPath $inputPath).Path
        & "$env:TOBI_EXE_PATH" canon $resolvedInput

    - name: Run golden
      if: ${{ inputs.mode == 'golden' }}
      shell: pwsh
      run: |
        $fixturesPath = "${{ inputs.golden_fixtures }}"
        if (-not (Test-Path -LiteralPath $fixturesPath)) {
          throw "Fixture file not found: $fixturesPath"
        }

        $resolvedFixtures = (Resolve-Path -LiteralPath $fixturesPath).Path
        & "$env:TOBI_EXE_PATH" golden $resolvedFixtures
